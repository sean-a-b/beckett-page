<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0f172a" />
  <title>Journal</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
</head>
<body>
  <main class="app">
    <header class="mini-header card">
      <h1>Journal</h1>
      <p class="section-hint">Private, local, offline.</p>
    </header>

    <section class="stats-grid" aria-label="Journal stats">
      <article class="card stat-card">
        <span class="stat-label">Current streak</span>
        <strong id="streakValue" class="stat-value">0</strong>
        <span id="streakDetail" class="stat-detail">days in a row</span>
      </article>

      <article class="card stat-card">
        <span class="stat-label">Today’s positives</span>
        <strong id="todayPositiveValue" class="stat-value">0</strong>
        <span class="stat-detail">saved entries</span>
      </article>

      <article class="card stat-card">
        <span class="stat-label">Graph</span>
        <button id="openGraphBtn" class="primary-btn" type="button">Open</button>
        <span class="stat-detail">rolling average</span>
      </article>

      <article class="card stat-card">
        <span class="stat-label">Calendar</span>
        <button id="openCalendarBtn" class="primary-btn" type="button">Open</button>
        <span class="stat-detail">browse entries</span>
      </article>
    </section>

    <section class="card recall-card compact">
      <div class="section-heading">
        <h2>Random recall</h2>
        <button id="randomButton" class="ghost-btn" type="button">Another one</button>
      </div>
      <blockquote id="recallText" class="recall-text">Add a positive entry and I’ll pull one back at random.</blockquote>
      <div id="recallMeta" class="recall-meta"></div>
    </section>

    <section class="card composer-card">
      <textarea id="entryText" placeholder="What did you do?"></textarea>

      <div class="rating-wrap">
        <div class="rating-label-row">
          <label for="ratingButtons">Rating</label>
          <span id="ratingValue">—</span>
        </div>
        <div id="ratingButtons" class="rating-buttons rating-strip" aria-label="Rating selector"></div>
      </div>

      <div class="composer-actions">
        <button id="submitBtn" class="primary-btn" type="button">Save entry</button>
      </div>

      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
