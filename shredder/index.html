<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#050816" />
    <meta
      name="description"
      content="Write a mistake, write a solution, and close the file."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />

    <title>Close the File</title>

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/script.js"></script>
  </head>

  <body>
    <main class="app-shell">
      <section class="closure-card" aria-labelledby="app-title">
        <div class="card-topline" aria-hidden="true"></div>

        <header class="card-header">
          <h1 id="app-title">Close the File</h1>
          <p class="subtitle">
            Write it once. Learn once.<br>Close it. Nothing is saved.
          </p>
        </header>

        <form class="closure-form" id="closure-form" autocomplete="off">
          <div class="field">
            <label for="mistake"><br>What happened?<br><br></label>
            <textarea
              id="mistake"
              name="mistake"
              rows="4"
              maxlength="500"
              placeholder="I forgot to say thanks."
              required
            ></textarea>
          </div>

          <div class="field">
            <label for="solution"><br><br>What will I do next time?<br><br></label>
            <textarea
              id="solution"
              name="solution"
              rows="4"
              maxlength="500"
              placeholder="Pause before leaving and say thanks."
              required
            ></textarea>
          </div>
<br><br>
          <button type="submit" class="submit-button" id="submit-button">
            <br>Close File<br><br>
          </button>
        </form>

        <section
          class="success-state"
          id="success-state"
          hidden
          aria-live="polite"
        >
          <div class="success-icon" aria-hidden="true">✓</div>
          <h2>File closed</h2>
          <p>Lesson extracted. No further action required.</p>
        </section>
      </section>

      <noscript>
        <div class="noscript">
          This app needs JavaScript enabled to close the file.
        </div>
      </noscript>
    </main>
  </body>
</html>
