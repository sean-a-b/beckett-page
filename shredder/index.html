<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="A simple closure app for writing a mistake, writing a solution, and closing the file."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Close the File</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/script.js"></script>
  </head>

  <body>
    <main class="app-shell">
      <section class="closure-card" aria-labelledby="app-title">
        <div class="card-topline" aria-hidden="true"></div>

        <header class="card-header">
          <p class="eyebrow">Private closure ritual</p>
          <h1 id="app-title">Close the File</h1>
          <p class="subtitle">
            Write it once. Learn once. Close it. Nothing is saved.
          </p>
        </header>

        <form class="closure-form" id="closure-form" autocomplete="off">
          <div class="field">
            <label for="mistake">What happened?</label>
            <textarea
              id="mistake"
              name="mistake"
              rows="4"
              maxlength="500"
              placeholder="I forgot to say thanks."
              required
            ></textarea>
          </div>

          <div class="field">
            <label for="solution">What will I do next time?</label>
            <textarea
              id="solution"
              name="solution"
              rows="4"
              maxlength="500"
              placeholder="Pause before leaving and say thanks."
              required
            ></textarea>
          </div>

          <button type="submit" class="submit-button" id="submit-button">
            Close File
          </button>
        </form>

        <section class="success-state" id="success-state" hidden aria-live="polite">
          <div class="success-icon" aria-hidden="true">✓</div>
          <h2>File closed</h2>
          <p>Lesson extracted. No further action required.</p>
        </section>
      </section>

      <noscript>
        <div class="noscript">
          This app needs JavaScript enabled to close the file.
        </div>
      </noscript>
    </main>
  </body>
</html>
